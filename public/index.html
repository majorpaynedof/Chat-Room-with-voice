<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Room</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
</head>
<body>
  <!-- Auth Screen -->
  <div id="auth-screen" class="screen">
    <div class="auth-container">
      <div class="auth-logo">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="var(--brand-color)">
          <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
          <path d="M7 9h2v2H7zm4 0h2v2h-2zm4 0h2v2h-2z"/>
        </svg>
        <h1>Welcome back!</h1>
        <p>We're so excited to see you again!</p>
      </div>

      <form id="auth-form">
        <div class="form-group">
          <label for="username">USERNAME</label>
          <input type="text" id="username" required minlength="2" maxlength="32" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">PASSWORD</label>
          <input type="password" id="password" required minlength="4" autocomplete="current-password">
        </div>
        <button type="submit" id="login-btn" class="btn-primary">Log In</button>
        <p class="auth-switch">
          Need an account? <a href="#" id="switch-to-register">Register</a>
        </p>
      </form>
    </div>
  </div>

  <!-- Main App -->
  <div id="app-screen" class="screen hidden">
    <!-- Server List Sidebar -->
    <nav id="server-list" class="server-list">
      <div class="server-icon home-icon" id="home-btn" title="Home / Direct Messages">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="white">
          <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
          <path d="M7 9h2v2H7zm4 0h2v2h-2zm4 0h2v2h-2z"/>
        </svg>
      </div>
      <div class="server-separator"></div>
      <div id="server-icons"></div>
      <div class="server-icon add-server-icon" id="add-server-btn" title="Add a Server">+</div>
    </nav>

    <!-- Channel Sidebar -->
    <aside id="channel-sidebar" class="channel-sidebar">
      <div class="sidebar-header" id="sidebar-header">
        <h2 id="server-name-display">Direct Messages</h2>
      </div>
      <div class="channel-list" id="channel-list"></div>
      <div class="user-panel">
        <div class="user-info">
          <div class="avatar small" id="user-avatar"></div>
          <span id="user-display-name"></span>
        </div>
        <div class="user-controls">
          <button class="icon-btn" id="settings-btn" title="Settings">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Chat Header -->
      <header class="chat-header">
        <div class="chat-header-info">
          <span class="channel-hash" id="channel-icon">#</span>
          <h3 id="chat-title">general</h3>
        </div>
        <div class="chat-header-actions">
          <button class="icon-btn" id="members-toggle" title="Toggle Member List">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Messages Area -->
      <div class="chat-area">
        <div class="messages-container" id="messages-container">
          <div id="messages"></div>
        </div>

        <!-- Message Input -->
        <div class="message-input-container" id="message-input-area">
          <div class="message-input-wrapper">
            <button class="icon-btn upload-btn" id="upload-btn" title="Upload Image">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/>
              </svg>
            </button>
            <input type="file" id="file-input" accept="image/*" hidden>
            <input type="text" id="message-input" placeholder="Message #general" maxlength="2000" autocomplete="off">
          </div>
          <div id="image-preview" class="image-preview hidden">
            <img id="preview-img" src="" alt="Preview">
            <button class="remove-preview" id="remove-preview">&times;</button>
          </div>
          <div id="typing-indicator" class="typing-indicator hidden"></div>
        </div>
      </div>

      <!-- Members Sidebar -->
      <aside id="members-sidebar" class="members-sidebar">
        <div id="members-list"></div>
      </aside>
    </main>
  </div>

  <!-- Modals -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 id="modal-title"></h2>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Image Viewer -->
  <div id="image-viewer" class="image-viewer hidden" onclick="this.classList.add('hidden')">
    <img id="viewer-img" src="" alt="Full size image">
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
